<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Platform Projects Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--bg2:#FAFAFA;--sur:#FFFFFF;--s2:#F4F4F5;--s3:#E4E4E7;--bdr:#EAEAEC;--bdr2:#D4D4D8;--t:#18181B;--t2:#52525B;--t3:#A1A1AA;--acc:#4F46E5;--acc-l:#EEF2FF;--red:#DC2626;--red-l:#FEF2F2;--amb:#D97706;--amb-l:#FFFBEB;--grn:#16A34A;--grn-l:#F0FDF4;--blu:#2563EB;--blu-l:#EFF6FF;--mono:'JetBrains Mono',monospace;--r:6px;--r2:10px;--sh:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05);--sh2:0 8px 24px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t);height:100vh;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;}
@keyframes spin{to{transform:rotate(360deg)}}
.app{display:grid;grid-template-columns:1fr;grid-template-rows:44px 36px 1fr;height:100vh;overflow:hidden;position:relative;}
.topbar{grid-column:1/-1;background:var(--sur);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;}
.app-title{font-size:13px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.top-btns{display:flex;gap:5px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--sur);color:var(--t);font-size:11px;font-family:inherit;cursor:pointer;font-weight:500;line-height:1.4;white-space:nowrap;}
.btn:hover{background:var(--s2);}
.btn-p{background:var(--t);color:#fff;border-color:var(--t);}
.btn-p:hover{background:#2a2a2a;}
.menu-item{padding:7px 14px;font-size:12px;cursor:pointer;color:var(--t);white-space:nowrap;display:block;width:100%;}
.menu-item:hover{background:var(--s2);}
.menu-sep{height:1px;background:var(--bdr);margin:3px 0;}
.toolbar{grid-column:1;background:var(--sur);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:5px;padding:0 12px;overflow-x:auto;}
.toolbar::-webkit-scrollbar{height:0;}
.dev-toolbar{grid-column:1;background:var(--sur);border-bottom:1px solid var(--bdr);border-right:1px solid var(--bdr);display:flex;align-items:center;padding:0 8px;gap:5px;}
.dev-lbl{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);}
.srch{flex:1;min-width:0;padding:4px 7px;border:1px solid var(--bdr);border-radius:var(--r);font-size:11px;font-family:inherit;background:var(--s2);color:var(--t);outline:none;}
.srch:focus{border-color:var(--acc);background:var(--sur);}
.fb{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--bdr);background:var(--sur);cursor:pointer;color:var(--t2);font-family:inherit;white-space:nowrap;}
.fb.on{background:var(--t);color:#fff;border-color:var(--t);}
.tb-sep{width:1px;height:14px;background:var(--bdr);flex-shrink:0;}
.view-seg{display:flex;border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;}
.vs-btn{padding:3px 9px;font-size:11px;font-family:inherit;background:var(--sur);border:none;cursor:pointer;color:var(--t2);border-right:1px solid var(--bdr);}
.vs-btn:last-child{border-right:none;}
.vs-btn.on{background:var(--t);color:#fff;}
.dev-panel{grid-row:3;background:var(--sur);border-right:1px solid var(--bdr);overflow-y:auto;display:flex;flex-direction:column;}
.dev-group-lbl{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 3px;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
.dev-group-cnt{font-size:10px;padding:1px 5px;border-radius:99px;background:var(--s2);color:var(--t2);}
.dc{display:flex;align-items:center;gap:7px;padding:7px 8px;border-bottom:1px solid var(--bdr);position:relative;}
.dc:hover .d-acts{opacity:1;}
.dav{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;cursor:pointer;}
.dav img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
.d-info{flex:1;min-width:0;}
.d-name{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-meta{display:flex;align-items:center;gap:4px;margin-top:1px;flex-wrap:wrap;}
.d-pct{font-size:10px;font-family:var(--mono);font-weight:600;}
.d-pct.over{color:var(--red);}
.d-pct.warn{color:var(--amb);}
.off-tag{font-size:8px;padding:1px 4px;border-radius:3px;background:var(--blu-l);color:var(--blu);font-weight:600;}
.d-acts{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px;opacity:0;transition:opacity .1s;background:var(--sur);border-radius:var(--r);padding:2px;}
.ib{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;border:none;background:transparent;cursor:pointer;color:var(--t2);}
.ib:hover{background:var(--s2);}
.ib svg{width:11px;height:11px;}
.gh-bar{display:flex;align-items:center;gap:3px;margin-top:2px;}
.gh-dot{width:5px;height:5px;border-radius:50%;}
.gh-badge{font-size:9px;padding:1px 4px;border-radius:3px;background:#F5F0FF;color:#6D28D9;font-weight:600;white-space:nowrap;}
.board-wrap{grid-column:1;grid-row:3;overflow:auto;background:var(--bg);}
.sum-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 12px 0;}
.sum-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);padding:11px 13px;}
.sum-val{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;line-height:1;}
.sum-lbl{font-size:10px;color:var(--t2);margin-top:2px;font-weight:500;}
.sum-card.red{border-left:3px solid var(--red);}
.sum-card.amb{border-left:3px solid var(--amb);}
.sum-card.grn{border-left:3px solid var(--grn);}
.sum-bar-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.sum-chip{font-size:9px;padding:1px 5px;border-radius:99px;background:var(--s2);color:var(--t2);cursor:pointer;white-space:nowrap;}
.sum-chip:hover{background:var(--s3);}
.sum-chip.red{background:var(--red-l);color:var(--red);}
.sum-chip.amb{background:var(--amb-l);color:var(--amb);}
.ws-row{padding:8px 12px 4px;display:flex;align-items:center;gap:8px;}
.ws-label{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;}
.ws-dot{width:6px;height:6px;border-radius:50%;}
.ws-count{font-size:9px;color:var(--t3);}
.ws-chevron{font-size:10px;color:var(--t3);transition:transform .2s;}
.ws-chevron.collapsed{transform:rotate(-60deg);}
.cards-row{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 10px;}
.kb-cols{display:flex;gap:12px;padding:12px;overflow-x:auto;align-items:flex-start;height:100%;box-sizing:border-box;}
.kb-col{flex:0 0 258px;width:258px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);display:flex;flex-direction:column;max-height:100%;}
.kb-col-head{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--bg2);border-radius:var(--r2) var(--r2) 0 0;z-index:1;}
.kb-col-dot{width:8px;height:8px;border-radius:99px;flex-shrink:0;}
.kb-col-title{font-size:12px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kb-col-count{font-size:10px;font-family:var(--mono);color:var(--t3);background:var(--sur);border:1px solid var(--bdr);border-radius:99px;padding:1px 7px;}
.kb-col-body{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.kb-col-body .pc{width:auto;min-width:0;}
.kb-col-empty{font-size:10px;color:var(--t3);text-align:center;padding:14px 8px;}
.kb-wip-warn{color:var(--red)!important;border-color:var(--red)!important;}
.port-wrap{padding:14px 16px;overflow-y:auto;height:100%;box-sizing:border-box;}
.port-group{margin-bottom:20px;}
.port-group-hd{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.port-group-dot{width:9px;height:9px;border-radius:99px;flex-shrink:0;}
.port-group-title{font-size:12px;font-weight:700;letter-spacing:.03em;}
.port-group-count{font-size:10px;font-family:var(--mono);color:var(--t3);background:var(--sur);border:1px solid var(--bdr);border-radius:99px;padding:1px 8px;}
.port-group-rule{flex:1;height:1px;background:var(--bdr);}
.port-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.port-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s;}
.port-card:hover{box-shadow:var(--sh);transform:translateY(-1px);}
.port-card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-l);}
.port-park{flex-shrink:0;font-size:11px;color:var(--t3);cursor:pointer;opacity:0;transition:opacity .12s;padding:0 2px;line-height:1;}
.port-card:hover .port-park{opacity:.6;}
.port-park:hover{opacity:1!important;color:var(--red);}
.port-card-parked{opacity:.66;}
.plan-chip{font-size:8px;font-weight:600;padding:1px 5px;border-radius:99px;background:rgba(124,58,237,.14);color:#7C3AED;margin-left:5px;}
.plan-av{outline:1.5px dashed #7C3AED;outline-offset:1px;}
#plan-banner{background:rgba(124,58,237,.10);border-bottom:1px solid rgba(124,58,237,.25);color:#7C3AED;font-size:11px;padding:6px 16px;display:flex;align-items:center;gap:10px;}
#planmode-btn.on{background:#7C3AED;color:#fff;border-color:#7C3AED;}
.port-card-parked:hover{opacity:1;}
.pl-wrap{overflow-x:auto;padding:4px 18px 40px}.pl-inner{min-width:880px;max-width:1280px}
.pl-gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bdr);cursor:pointer;user-select:none}
.pl-cols,.pl-row{display:grid;grid-template-columns:18px minmax(220px,1fr) 120px 120px 170px 110px 52px;gap:12px;align-items:center}
.pl-cols{padding:8px 0 4px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.pl-row{padding:10px 8px;margin:0 -8px;border-radius:8px;cursor:pointer}.pl-row:hover{background:var(--s2)}
.pl-act{display:flex;gap:8px;justify-content:flex-end;font-size:13px;color:var(--t3);opacity:0;transition:opacity .12s}.pl-row:hover .pl-act{opacity:1}
.pl-act span{cursor:pointer}.pl-act span:hover{color:var(--t)}
.pl-flag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px}
.eng-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s;}
.eng-card:hover{border-color:var(--acc);box-shadow:var(--sh);transform:translateY(-1px);}
.eng-card-muted{opacity:.62;}
.eng-card-muted:hover{opacity:1;}
.jsp-spin{display:inline-block;animation:jspspin 1s linear infinite;color:var(--acc);}
@keyframes jspspin{to{transform:rotate(360deg)}}
.pc{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);width:220px;min-width:220px;cursor:pointer;transition:border-color .1s,box-shadow .1s;position:relative;overflow:hidden;}
.pc:hover{border-color:var(--bdr2);box-shadow:var(--sh);}
.pc.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-l);}
.pc-stripe{height:3px;}
.pc-body{padding:8px 9px 6px;}
.pc-name{font-size:11px;font-weight:500;line-height:1.3;margin-bottom:4px;}
.pc-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.tag{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;}
.pri1{background:var(--red-l);color:var(--red);}
.pri2{background:var(--amb-l);color:var(--amb);}
.pri3{background:var(--acc-l);color:var(--acc);}
.pri4{background:var(--s2);color:var(--t3);}
.pc-date{font-size:9px;padding:1px 4px;border-radius:3px;font-family:var(--mono);}
.pc-date.overdue{background:var(--red-l);color:var(--red);}
.pc-date.soon{background:var(--amb-l);color:var(--amb);}
.pc-date.ok{background:var(--grn-l);color:var(--grn);}
.sz-tag{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--s2);color:var(--t3);}
.flags-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;}
.flag{display:inline-flex;align-items:center;gap:2px;font-size:9px;font-weight:600;padding:1px 5px;border-radius:99px;cursor:pointer;user-select:none;border:1px solid transparent;}
.flag-red{background:#FEE2E2;color:#991B1B;border-color:#FECACA;}
.flag-amber{background:#FEF3C7;color:#92400E;border-color:#FDE68A;}
.flag-blue{background:#DBEAFE;color:#1E40AF;border-color:#BFDBFE;}
.flag-green{background:#D1FAE5;color:#065F46;border-color:#A7F3D0;}
.flag-purple{background:#EDE9FE;color:#5B21B6;border-color:#DDD6FE;}
.flag-gray{background:#F3F4F6;color:#374151;border-color:#E5E7EB;}
.pc-devs{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;padding-top:5px;border-top:1px solid var(--bdr);}
.pc-dev-chip{display:flex;align-items:center;gap:3px;font-size:9px;padding:2px 6px;border-radius:99px;background:var(--s2);cursor:pointer;color:var(--t2);}
.pc-dev-chip:hover{background:var(--s3);}
.pc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px;padding-top:6px;border-top:1px solid var(--bdr);}
.pc-avs{display:inline-flex;align-items:center;}
.pc-av{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;overflow:hidden;border:1.5px solid var(--sur);box-sizing:content-box;}
.pc-av img{width:100%;height:100%;object-fit:cover;}
.pc-av-more{background:var(--s3);color:var(--t2);font-size:9px;}
.pc-foot-pct{font-size:10px;font-family:var(--mono);font-weight:600;color:var(--t3);}
.pc-flag-dot{width:7px;height:7px;border-radius:50%;display:inline-block;border:1px solid transparent;}
.pc-flag-dot.flag-red{background:#EF4444;}
.pc-flag-dot.flag-amber{background:#F59E0B;}
.pc-flag-dot.flag-blue{background:#3B82F6;}
.pc-flag-dot.flag-green{background:#10B981;}
.pc-flag-dot.flag-purple{background:#8B5CF6;}
.pc-flag-dot.flag-gray{background:#9CA3AF;}
.pc-meta{margin-top:5px;}
.pc-dev-av{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0;overflow:hidden;}
.pc-dev-av img{width:100%;height:100%;object-fit:cover;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dot-on{background:var(--grn);}
.dot-risk{background:var(--amb);}
.dot-block{background:var(--red);}
.dot-done{background:var(--t3);}
.dot-plan{background:var(--acc);}
.detail-panel{grid-row:3;background:var(--sur);border-left:1px solid var(--bdr);overflow-y:auto;}
.dp-head{padding:12px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;gap:8px;position:sticky;top:0;background:var(--sur);z-index:1;}
.dp-title{font-size:13px;font-weight:600;flex:1;line-height:1.3;}
.sec{margin:10px 14px;}
.sec-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.notes{width:100%;padding:7px 8px;border:1px solid var(--bdr);border-radius:var(--r);font-size:11px;font-family:inherit;resize:vertical;min-height:60px;outline:none;color:var(--t);background:var(--s2);}
.notes:focus{border-color:var(--acc);background:var(--sur);}
.field{margin-bottom:10px;}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:6px 9px;border:1px solid var(--bdr);border-radius:var(--r);font-size:12px;font-family:inherit;outline:none;background:var(--sur);color:var(--t);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);}
.alloc-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bdr);}
.alloc-row:last-child{border-bottom:none;}
.alloc-bar{flex:1;height:4px;background:var(--s2);border-radius:99px;overflow:hidden;}
.alloc-fill{height:100%;border-radius:99px;}
.qa-grid{display:flex;flex-wrap:wrap;gap:5px;}
.qa-chip{display:flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--bdr);border-radius:var(--r);background:var(--sur);cursor:pointer;font-size:11px;font-family:inherit;}
.qa-chip:hover{background:var(--s2);}
.qa-av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0;overflow:hidden;}
.qa-av img{width:100%;height:100%;object-fit:cover;}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal{background:var(--sur);border-radius:var(--r2);box-shadow:var(--sh2);width:90%;max-width:500px;max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;}
.mh{padding:14px 16px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.mt{font-size:14px;font-weight:600;flex:1;}
.mb{padding:14px 16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.mf{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:var(--r2);font-size:12px;font-weight:500;box-shadow:var(--sh2);z-index:9999;pointer-events:none;animation:toast-in .2s ease;}
.toast.warn{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;}
.toast.info{background:#EFF6FF;color:#1E40AF;border:1px solid #BFDBFE;}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.heatmap-wrap{padding:16px;overflow:auto;}
.hm-table{border-collapse:separate;border-spacing:3px;font-size:11px;}
.hm-th{font-size:9px;font-weight:600;padding:4px 6px;color:var(--t3);text-align:left;white-space:nowrap;}
.hm-dev{font-size:11px;font-weight:500;padding:4px 8px;white-space:nowrap;}
.hm-cell{width:56px;height:28px;border-radius:var(--r);font-size:10px;font-family:var(--mono);font-weight:600;text-align:center;cursor:pointer;}
.insights-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:200;display:flex;align-items:flex-start;justify-content:flex-end;backdrop-filter:blur(2px);}
.insights-drawer{width:400px;height:100vh;background:var(--sur);display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.1);}
.insights-head{padding:14px 16px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.insights-body{flex:1;overflow-y:auto;padding:12px 14px 20px;}
.insight-card{border:1px solid var(--bdr);border-radius:var(--r2);padding:11px 13px;margin-bottom:9px;}
.insight-card.risk{border-left:3px solid var(--red);}
.insight-card.warn{border-left:3px solid var(--amb);}
.insight-card.good{border-left:3px solid var(--grn);}
.insight-card.info{border-left:3px solid var(--acc);}
.insight-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.insight-label.risk{color:var(--red);}
.insight-label.warn{color:var(--amb);}
.insight-label.good{color:var(--grn);}
.insight-label.info{color:var(--acc);}
.insight-title{font-size:12px;font-weight:600;margin-bottom:4px;line-height:1.3;}
.insight-body{font-size:11px;color:var(--t2);line-height:1.5;}
.insight-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}

async function stCheck(first){

      var rr=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({baseRev:0,data:stSnapshot()})});
      if(rr.ok){var j=await rr.json();_st.rev=j.rev;localStorage.setItem('plt_state_rev',String(j.rev));_st.ok=true;}else _st.ok=false;
      stInd();return;}
    if(!r.ok){_st.ok=false;stInd();return;}
    var cur=await r.json();_st.ok=true;
    if(cur.same){if(!_st.last)_st.last=stNorm(stSnapshot());stInd();return;}
    if(cur.rev>_st.rev){
      if(stNorm(cur.data)===stNorm(stSnapshot())){_st.rev=cur.rev;localStorage.setItem('plt_state_rev',String(cur.rev));_st.last=stNorm(stSnapshot());stInd();return;}

}

function trendSnapshot(cur){
  // cur = {capPct, blocked, atRisk, overloaded}; returns previous week's snapshot for comparison
  let arr=[];try{arr=JSON.parse(localStorage.getItem('plt_trend')||'[]');}catch(e){}
  const wk=isoWeek(new Date());
  const prior=arr.filter(s=>s.week!==wk).sort((a,b)=>a.week<b.week?1:-1)[0]||null;
  // upsert current week
  arr=arr.filter(s=>s.week!==wk);arr.push(Object.assign({week:wk},cur));
  arr=arr.sort((a,b)=>a.week<b.week?1:-1).slice(0,8);
  try{localStorage.setItem('plt_trend',JSON.stringify(arr));}catch(e){}
  return prior;

function throughputSnapshot(){

  const total=Object.keys(ghData).reduce((s,id)=>s+(ghData[id].merged||0),0);
  let arr=[];try{arr=JSON.parse(localStorage.getItem('plt_throughput')||'[]');}catch(e){}
  const wk=isoWeek(new Date());
  arr=arr.filter(s=>s.week!==wk);
  if(Object.keys(ghData).length)arr.push({week:wk,merged:total});
  arr=arr.sort((a,b)=>a.week<b.week?-1:1).slice(-8);

function milestoneProgress(p){const ms=p.milestones||[];if(!ms.length)return'';const done=ms.filter(m=>m.done).length;return '<span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--t2)">'+done+'/'+ms.length+' done</span>';}

function addMilestone(pid){const p=projects.find(x=>x.id===pid);if(!p)return;const ti=document.getElementById('ms-title-'+pid),di=document.getElementById('ms-date-'+pid);const title=(ti.value||'').trim();if(!title)return;if(!p.milestones)p.milestones=[];p.milestones.push({title:title,date:di.value||'',done:false});save();selProject(pid);if(view==='overview')renderOverview();}
function toggleMilestone(pid,idx){const p=projects.find(x=>x.id===pid);if(!p||!p.milestones[idx])return;p.milestones[idx].done=!p.milestones[idx].done;save();selProject(pid);if(view==='overview')renderOverview();}
function removeMilestone(pid,idx){const p=projects.find(x=>x.id===pid);if(!p||!p.milestones)return;p.milestones.splice(idx,1);save();selProject(pid);if(view==='overview')renderOverview();}
async function draftExecSummary(pid){
  const p=projects.find(x=>x.id===pid);if(!p)return;
  if(!anthropicKey){showToast('Add an Anthropic key in ⚙️ Settings to draft','warn');return;}
  const btn=document.getElementById('draft-btn-'+pid);if(btn){btn.textContent='Drafting…';btn.disabled=true;}
  const mems=(assignments[pid]||[]).map(a=>{const d=devs.find(x=>x.id===a.devId);return d?d.name.split(' ')[0]+' ('+a.pct+'%)':null;}).filter(Boolean);
  const gh={};(assignments[pid]||[]).forEach(a=>{const g=ghData[a.devId];if(g){gh[devs.find(d=>d.id===a.devId).name.split(' ')[0]]={merged:g.merged||0,open:g.openPRs||0};}});
  const ctx={name:p.name,workstream:p.workstream,priority:priLabel(p.priority),status:p.status,deadline:p.deadline||'none',quarter:p.quarter||'',nextStep:p.nextStep||'',team:mems,milestones:(p.milestones||[]).map(m=>({title:m.title,date:m.date,done:!!m.done})),recentPRactivity:Object.keys(gh).length?gh:'none',today:new Date().toISOString().slice(0,10)};
  const prompt='Write a 1-2 sentence executive summary of how this engineering project is tracking. Be specific and factual using ONLY this data. Lead with whether it is on track, at risk, or slipping, then the key reason and next milestone. No fluff, no preamble — just the summary sentence(s). Data: '+JSON.stringify(ctx);
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:300,messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();

    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();

  }catch(err){showToast('Draft failed: '+err.message,'warn');if(btn){btn.textContent='✦ Draft with AI';btn.disabled=false;}}
}
// ── PR/Repo-based dev matching ──
function allRepos(){const set={};Object.keys(ghData).forEach(id=>{const g=ghData[id];(g.prList||[]).forEach(pr=>{if(pr.repo)set[pr.repo]=(set[pr.repo]||0)+1;});(g.repos||[]).forEach(r=>{if(r&&!set[r])set[r]=set[r]||0;});});return Object.keys(set).sort((a,b)=>set[b]-set[a]);}
function devRepoCount(devId,repo){const g=ghData[devId];if(!g)return 0;return (g.prList||[]).filter(pr=>pr.repo===repo).length;}
function suggestDevsForProject(p){
  const repos=p.repos||[];if(!repos.length)return [];
  const rows=devs.map(d=>{let prCount=0;const hitRepos={};repos.forEach(r=>{const c=devRepoCount(d.id,r);if(c>0){prCount+=c;hitRepos[r]=c;}});const pct=alloc(d.id),cap=d.capacity||100;const assigned=!!(assignments[p.id]||[]).find(a=>a.devId===d.id);return{dev:d,prCount:prCount,hitRepos:hitRepos,pct:pct,cap:cap,free:cap-pct,assigned:assigned};}).filter(r=>r.prCount>0);
  rows.sort((a,b)=>b.prCount-a.prCount||b.free-a.free);
  return rows;
}
function projectsWithRepos(){return projects.filter(p=>!p.archived&&(p.repos||[]).length);}
function toggleProjRepo(pid,repo){const p=projects.find(x=>x.id===pid);if(!p)return;if(!p.repos)p.repos=[];const i=p.repos.indexOf(repo);if(i>=0)p.repos.splice(i,1);else p.repos.push(repo);save();selProject(pid);}
function ghMatchSection(p,pid){
  const synced=Object.keys(ghData).length>0;
  if(!synced)return '<div class="sec"><div class="sec-lbl">GitHub match</div><div style="font-size:11px;color:var(--t3);padding:2px 0">Sync GitHub (⚙️ → GitHub) to match devs by the repos their PRs touch.</div></div>';
  const repos=allRepos();
  const mapped=p.repos||[];
  const chips=repos.slice(0,24).map(r=>{const on=mapped.indexOf(r)>=0;return '<span class="repo-chip'+(on?' on':'')+'" onclick="toggleProjRepo(\''+pid+'\',\''+r.replace(/'/g,"\\'")+'\')">'+(on?'✓ ':'')+r+'</span>';}).join('');
  let suggest='';
  if(mapped.length){
    const rows=suggestDevsForProject(p);
    if(rows.length){
      suggest='<div style="font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin:10px 0 6px">Suggested by PR activity</div>'+rows.slice(0,6).map(r=>{const col=ac(r.pct,r.cap);const repoList=Object.keys(r.hitRepos).map(rp=>rp+' ('+r.hitRepos[rp]+')').join(', ');return '<div class="gh-sug-row"><div style="flex-shrink:0">'+avEl(r.dev,26)+'</div><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px">'+r.dev.name.split(' ')[0]+' '+r.dev.name.split(' ').slice(1).join(' ')+'<span style="font-size:10px;font-family:var(--mono);color:'+col+'">'+r.pct+'%</span>'+(r.free>0?'<span style="font-size:9px;color:var(--grn)">'+r.free+'% free</span>':'<span style="font-size:9px;color:var(--red)">full</span>')+'</div><div style="font-size:10px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+r.prCount+' PR'+(r.prCount!==1?'s':'')+' in '+repoList+'</div></div>'+(r.assigned?'<span style="font-size:10px;color:var(--grn);flex-shrink:0">✓ on team</span>':'<button class="btn" style="flex-shrink:0;font-size:10px;padding:3px 8px" onclick="assignFromMatch(\''+pid+'\',\''+r.dev.id+'\')">+ Assign</button>')+'</div>';}).join('');
    }else{
      suggest='<div style="font-size:11px;color:var(--t3);margin-top:8px">No devs have PRs in the selected repo'+(mapped.length>1?'s':'')+' (last 60 days).</div>';
    }
  }else{
    suggest='<div style="font-size:11px;color:var(--t3);margin-top:6px">Pick the repo(s) this project ships in ↑ to see who\'s been working there.</div>';
  }
  return '<div class="sec"><div class="sec-lbl">GitHub match <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--t3)">'+(mapped.length?mapped.length+' repo'+(mapped.length>1?'s':''):'link repos')+'</span></div><div class="repo-chips">'+chips+'</div>'+suggest+'</div>';
}
function assignFromMatch(pid,devId){
  if(!assignments[pid])assignments[pid]=[];
  if((assignments[pid]).find(a=>a.devId===devId))return;
  const d=devs.find(x=>x.id===devId);const cap=d?(d.capacity||100):100;const free=Math.max(0,cap-alloc(devId));
  const pct=free>=25?25:(free>0?free:10);
  assignments[pid].push({devId:devId,pct:pct,src:'plan'});
  save();selProject(pid);if(view==='overview')renderOverview();if(view==='board')renderBoard();
}
function assignFromMatcher(pid,devId){assignFromMatch(pid,devId);openPRMatcher();}
function openPRMatcher(){
  const synced=Object.keys(ghData).length>0;

      sections+=withRepos.map(p=>{
        const rows=suggestDevsForProject(p);

        return '<div style="border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span class="tag '+priCls(p.priority)+'">'+priLabel(p.priority)+'</span><span style="font-size:13px;font-weight:600;cursor:pointer" onclick="closeModal();openProject(\''+p.id+'\')">'+p.name+'</span></div><div class="repo-chips" style="margin-bottom:8px">'+repoTags+'</div>'+sug+'</div>';
      }).join('');
    }
    let unmapped='';

      unmapped='<div style="font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin:14px 0 8px">Not yet linked to repos ('+without.length+')</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+without.map(p=>'<span class="repo-chip" style="cursor:pointer" onclick="closeModal();openProject(\''+p.id+'\')">'+p.name+' →</span>').join('')+'</div>';
    }
    body='<div style="padding:14px 16px">'+(withRepos.length?sections:'<div style="font-size:12px;color:var(--t2);margin-bottom:12px">No projects linked to repos yet. Open a project and pick its repo(s) under <b>GitHub match</b>, then they\'ll show up here with suggested devs.</div>')+unmapped+'</div>';
  }
  document.getElementById('mc').innerHTML='<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:560px;max-height:90vh"><div class="mh" style="position:sticky;top:0;background:var(--sur);z-index:1"><div class="mt">🔗 PR Matcher <span style="font-size:11px;font-weight:400;color:var(--t3)">devs by repo activity</span></div><button class="ib" onclick="closeModal()"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg></button></div><div style="overflow-y:auto">'+body+'</div></div></div>';
}

  const panel=document.getElementById('detail-panel');
  panel.style.display='block';
  const mems=assignments[pid]||[];
  const allocRows=mems.map(a=>{const d=devs.find(x=>x.id===a.devId);if(!d)return'';const col=ac(a.pct);return '<div class="alloc-row">'+avEl(d,20)+'<span style="flex:1;font-size:11px;font-weight:500">'+d.name.split(' ')[0]+(a.via==='pr'?' <span style="font-size:9px;font-weight:400;color:var(--t3)">from PRs</span>':'')+'</span><div class="alloc-bar"><div class="alloc-fill" style="width:'+a.pct+'%;background:'+col+'"></div></div><span style="font-size:11px;font-family:var(--mono);min-width:32px;text-align:right;color:'+col+'">'+a.pct+'%</span><button class="ib" onclick="removeAssignment(\''+pid+'\',\''+d.id+'\')"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg></button></div>';}).join('');

    '<div class="sec"><div class="sec-lbl">Details'+(p.statusOverride?' <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--acc);font-size:9px">· status set by you · <a onclick="revertProjStatus(\''+pid+'\')" style="cursor:pointer">use Jira</a></span>':(p.statusFromJira||p.dateFromJira)?' <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--t3);font-size:9px">· synced from Jira</span>':'')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><select onchange="setProjStatus(\''+pid+'\',this.value)" style="font-size:11px;padding:4px 7px;border:1px solid var(--bdr);border-radius:var(--r);font-family:inherit;background:var(--sur);cursor:pointer">'+['in-progress','at-risk','blocked','planned','done'].map(s=>'<option value="'+s+'"'+(p.status===s||(s==='in-progress'&&p.status==='on-track')?' selected':'')+'>'+stLbl(s)+'</option>').join('')+'</select><select onchange="updateProjField(\''+pid+'\',\'workstream\',this.value)" style="font-size:11px;padding:4px 7px;border:1px solid var(--bdr);border-radius:var(--r);font-family:inherit;background:var(--sur);cursor:pointer">'+wsAll().map(ws=>'<option value="'+ws+'"'+(p.workstream===ws?' selected':'')+'>'+ws+'</option>').join('')+'</select><input type="date" value="'+(p.deadline||'')+'" title="Deadline" style="font-size:11px;padding:4px 7px;border:1px solid var(--bdr);border-radius:var(--r);font-family:inherit;outline:none;background:var(--sur);color:var(--t)" onchange="updateProjField(\''+pid+'\',\'deadline\',this.value)"></div></div>'+

function openProject(pid){selProject(pid);const p=document.getElementById('detail-panel');if(p)p.scrollTop=0;}

// ---- Status narrative: p.sn = {t:'what is happening', ask:'decision/help needed', at:ISO} ----
function snAge(p){if(!p.sn||!p.sn.at)return null;return Math.floor((Date.now()-Date.parse(p.sn.at))/864e5);}
function snStale(p){var a=snAge(p);var hot=p.status==='blocked'||p.status==='at-risk'||(p.deadline&&p.deadline<new Date().toISOString().slice(0,10)&&p.status!=='done');return hot&&(a==null||a>14);}
function snSuffix(p){var a=snAge(p);return a==null?' \u00b7 no status update':(a>14?' \u00b7 update is '+a+'d old':'');}
function snAgo(p){var a=snAge(p);return a==null?'':(a===0?'today':a+'d ago');}
function saveStatusNote(pid){
  var p=projects.find(function(x){return x.id===pid;});if(!p)return;
  var t=document.getElementById('sn-t-'+pid),k=document.getElementById('sn-a-'+pid);
  var nt=t?t.value.trim():'',na=k?k.value.trim():'';
  var old=p.sn||{};if(nt===(old.t||'')&&na===(old.ask||''))return;
  p.sn={t:nt,ask:na,at:(nt||na)?new Date().toISOString():''};
  save();if(view==='board')renderBoard();if(view==='overview')renderOverview();
  var m=document.getElementById('sn-meta-'+pid);if(m)m.textContent=(nt||na)?'Saved \u00b7 just now':'';
}
function clearAsk(pid){var p=projects.find(function(x){return x.id===pid;});if(!p||!p.sn)return;p.sn.ask='';p.sn.at=new Date().toISOString();save();if(view==='overview')renderOverview();if(view==='board')renderBoard();}
function statusSection(p){

function renderTeamMetrics(){
  const active=projects.filter(p=>!p.archived);
  const synced=Object.keys(ghData).length>0;
  // Flow stats from GitHub
  let throughput=0,wip=0,cycles=[];const aging=[];
  Object.keys(ghData).forEach(id=>{const g=ghData[id];throughput+=g.merged||0;wip+=g.openPRs||0;if(g.avgCycleDays!=null)cycles.push({id:id,d:g.avgCycleDays});(g.prList||[]).forEach(pr=>{if(pr.state==='open'&&!pr.merged)aging.push({id:id,title:pr.title,repo:pr.repo,days:pr.daysOpen,url:pr.url});});});
  const avgCycle=cycles.length?Math.round(cycles.reduce((a,b)=>a+b.d,0)/cycles.length*10)/10:null;
  aging.sort((a,b)=>b.days-a.days);
  const blocked=active.filter(p=>p.status==='blocked').length;

  const card=(v,l,c)=>'<div style="background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);padding:11px;text-align:center"><div style="font-size:20px;font-weight:700;font-family:var(--mono);color:'+c+'">'+v+'</div><div style="font-size:10px;color:var(--t2);margin-top:2px">'+l+'</div></div>';

  // ── Synthesized flow-health verdict (the story) ──
  const stuckCount=aging.filter(a=>a.days>14).length;
  const stuckRatio=wip>0?Math.round(stuckCount/wip*100):0;
  const overloaded=Object.keys(ghData).filter(id=>(ghData[id].openPRs||0)>3).length;
  const soloCount=active.filter(p=>(assignments[p.id]||[]).length===1&&p.priority<=2).length;
  const slowShippers=cycles.filter(c=>c.d>14).length;
  // throughput direction
  let tpArr=[];try{tpArr=JSON.parse(localStorage.getItem('plt_throughput')||'[]');}catch(e){}
  const tpDelta=tpArr.length>=2?tpArr[tpArr.length-1].merged-tpArr[tpArr.length-2].merged:null;

  let verdict,vColor,vBg,vIcon;const issues=[];
  if(stuckRatio>40||blocked>=3)issues.push('flow is clogged');
  if(stuckCount>0)issues.push(stuckCount+' PR'+(stuckCount>1?'s':'')+' stuck >14d');
  if(overloaded>0)issues.push(overloaded+' over WIP limit');
  if(soloCount>0)issues.push(soloCount+' P1/P2 single-owner');
  if(slowShippers>0)issues.push(slowShippers+' slow cycle');
  const severe=(stuckRatio>40)||(blocked>=3)||(overloaded>=4);
  const someIssues=issues.length>0;
  if(!synced){verdict='Sync GitHub to see team flow';vColor='var(--acc)';vBg='var(--acc-l)';vIcon='◔';}
  else if(severe){verdict='Flow needs attention';vColor='var(--red)';vBg='var(--red-l)';vIcon='▲';}
  else if(someIssues){verdict='Shipping, with some friction';vColor='var(--amb)';vBg='var(--amb-l)';vIcon='◐';}
  else{verdict='Healthy flow — shipping cleanly';vColor='var(--grn)';vBg='var(--grn-l)';vIcon='●';}
  const shipLine=synced?('Merged <b>'+throughput+'</b> in 90d'+(tpDelta!=null?', <b style="color:'+(tpDelta>=0?'var(--grn)':'var(--red)')+'">'+(tpDelta>=0?'▲':'▼')+' '+Math.abs(tpDelta)+'</b> vs last week':'')+(avgCycle!=null?' · avg cycle <b>'+avgCycle+'d</b>':'')):'No PR data yet';
  const issuePills=synced&&issues.length?'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">'+issues.map(i=>'<span style="font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--sur);border:1px solid '+vColor+';color:'+vColor+'">'+i+'</span>').join('')+'</div>':(synced?'<div style="font-size:11px;color:var(--grn);margin-top:6px">Nothing stuck, nobody overloaded, no single-owner risks.</div>':'');
  const verdictBanner='<div style="background:'+vBg+';border:1px solid '+vColor+';border-radius:var(--r2);padding:13px 15px;margin-bottom:16px"><div style="display:flex;align-items:center;gap:9px"><span style="font-size:16px;color:'+vColor+'">'+vIcon+'</span><span style="font-size:15px;font-weight:700;color:'+vColor+'">'+verdict+'</span></div><div style="font-size:12px;color:var(--t2);margin-top:6px">'+shipLine+'</div>'+issuePills+'</div>';

  // ── Richer hero cards with context ──
  const hcard=(v,l,sub,c,subc)=>'<div style="background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px 11px"><div style="font-size:22px;font-weight:700;font-family:var(--mono);color:'+c+';line-height:1">'+v+'</div><div style="font-size:10px;color:var(--t2);margin-top:4px">'+l+'</div><div style="font-size:9px;color:'+(subc||'var(--t3)')+';margin-top:5px;font-weight:500;min-height:11px">'+(sub||'')+'</div></div>';
  const cards='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px">'+
    hcard(synced?throughput:'—','Merged 90d',synced&&tpDelta!=null?(tpDelta>=0?'▲ ':'▼ ')+Math.abs(tpDelta)+' vs last wk':'',(synced?'var(--grn)':'var(--t3)'),tpDelta!=null?(tpDelta>=0?'var(--grn)':'var(--red)'):'var(--t3)')+
    hcard(avgCycle!=null?avgCycle+'d':'—','Avg cycle',avgCycle!=null?(avgCycle<=5?'fast':avgCycle<=14?'moderate':'slow'):'',avgCycle==null?'var(--t3)':avgCycle<=5?'var(--grn)':avgCycle<=14?'var(--amb)':'var(--red)',avgCycle==null?'var(--t3)':avgCycle<=5?'var(--grn)':avgCycle<=14?'var(--amb)':'var(--red)')+
    hcard(synced?wip:'—','Open PRs',synced?(overloaded>0?overloaded+' over limit':'balanced'):'',wip>15?'var(--amb)':'var(--t)',overloaded>0?'var(--amb)':'var(--grn)')+
    hcard(synced?stuckRatio+'%':'—','Stuck',synced?stuckCount+' PRs >14d':'',stuckRatio>40?'var(--red)':stuckRatio>20?'var(--amb)':'var(--grn)',stuckRatio>20?'var(--amb)':'var(--t3)')+'</div>';

  // Status funnel (Kanban columns)
  const cols=[{k:'planned',l:'Planned',c:'var(--t3)'},{k:'in-progress',l:'In progress',c:'var(--acc)'},{k:'at-risk',l:'At risk',c:'var(--amb)'},{k:'blocked',l:'Blocked',c:'var(--red)'},{k:'done',l:'Done',c:'var(--grn)'}];

  const funnel='<div style="font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin-bottom:10px">Work in flow</div><div style="display:flex;gap:6px;align-items:flex-end;height:90px;margin-bottom:6px">'+statusCounts.map(s=>'<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><div style="font-size:13px;font-weight:700;font-family:var(--mono);color:'+s.c+';margin-bottom:3px">'+s.n+'</div><div style="width:100%;height:'+Math.max(4,s.n/maxStatus*60)+'px;background:'+s.c+';border-radius:4px 4px 0 0;opacity:.85"></div></div>').join('')+'</div><div style="display:flex;gap:6px">'+statusCounts.map(s=>'<div style="flex:1;text-align:center;font-size:9px;color:var(--t2)">'+s.l+'</div>').join('')+'</div>';

  // Cycle time distribution

function renderRoadmap(){

async function generateInsights(){
  if(!anthropicKey){showInsightsPrompt();return;}
  const el=document.getElementById('insights-body');if(el)el.innerHTML='<div style="padding:20px;text-align:center;font-size:12px;color:var(--t2)">Analysing…</div>';
  const today=new Date().toISOString().slice(0,10);
  const snap={today:today,devs:devs.map(d=>{const pct=alloc(d.id),cap=d.capacity||100;const dps=projects.filter(p=>!p.archived&&p.status!=='done'&&(assignments[p.id]||[]).find(a=>a.devId===d.id));return{name:d.name,totalAlloc:pct,capacity:cap,overloaded:pct>=cap,free:pct<20,projectCount:dps.length,projects:dps.map(p=>{const a=(assignments[p.id]||[]).find(x=>x.devId===d.id);return{name:p.name.slice(0,35),deadline:p.deadline||'TBD',status:p.status,allocation:a?a.pct:0,workstream:p.workstream};})};})};
  const prompt='You are a tech lead analysing a PLT engineering team resource planner. Today is '+today+'. Provide 8-10 specific insights covering health, capacity risks, resourcing gaps, and availability forecast. Data: '+JSON.stringify(snap)+'. Return ONLY a JSON array. Each: {"type":"risk"|"warn"|"good"|"info","label":"string","title":"string","body":"string","chips":["name"]}. Be specific with names.';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();

    const ins=JSON.parse(txt.replace(/```json|```/g,'').trim());
    if(Array.isArray(ins)&&ins.length){window.LIVE_INSIGHTS=ins;renderInsights(ins);}
  }catch(err){if(el)el.innerHTML='<div style="padding:14px;font-size:12px;color:var(--red)">Error: '+err.message+'</div>';}
}

async function ghFetchCommits(headers,ORG,since){
  try{
    const ids=Object.keys(ghData||{});
    for(const did of ids){
      const g=ghData[did];if(!g||!g.login)continue;
      const q=encodeURIComponent('author:'+g.login+' org:'+ORG+' committer-date:>'+since);
      const r=await fetch('https://api.github.com/search/commits?q='+q+'&per_page=100&sort=committer-date',{headers:headers});
      if(r.status===403||r.status===429)break;
      if(r.ok){const d=await r.json();g.commits=(d.items||[]).filter(c=>!/^merge /i.test((c.commit&&c.commit.message)||'')).slice(0,100).map(c=>({m:String((c.commit&&c.commit.message)||'').split('\n')[0].slice(0,120),r:(c.repository&&c.repository.name)||''}));}
      await new Promise(res=>setTimeout(res,2200));
    }
    localStorage.setItem('plt_gh_data',JSON.stringify(ghData));
  }catch(e){console.warn('Commit fetch failed',e);}
}

      '<tr style="border-top:2px solid var(--bdr)"><td style="padding:5px 8px;position:sticky;left:0;background:var(--sur);font-weight:600;color:var(--t2)">Team</td>'+perWeek.map(n=>'<td style="padding:5px 6px;text-align:center;font-family:var(--mono);font-weight:600;color:var(--t2)">'+fmt(n)+'</td>').join('')+'<td style="padding:5px 8px;text-align:center;font-family:var(--mono);font-weight:700">'+fmt(grandTotal)+'</td></tr></tbody></table></div>';
    const W=440,H=54,pad=6;const mx=Math.max.apply(null,perWeek),mn=Math.min.apply(null,perWeek);const lo=Math.min(mn,0),hi=Math.max(mx,1);

    body='<div style="padding:14px 16px">'+
      '<div style="display:flex;gap:8px;margin-bottom:14px">'+
        '<div style="flex:1;background:var(--grn-l);border-radius:var(--r);padding:10px;text-align:center"><div style="font-size:20px;font-weight:700;font-family:var(--mono);color:var(--grn)">'+fmt(grandTotal)+'</div><div style="font-size:10px;color:var(--t2)">'+(isPts?'points done':'tickets done')+'</div></div>'+

  }
  document.getElementById('mc').innerHTML='<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:640px;max-height:92vh"><div class="mh" style="position:sticky;top:0;background:var(--sur);z-index:1"><div class="mt">🎫 Jira Throughput '+(hasData?'<span style="font-size:11px;font-weight:400;color:var(--t3)">resolved, last '+jt.weeks.slice(-10).length+' weeks</span>':'')+'</div><div style="display:flex;gap:6px">'+(hasData?'<button class="btn" id="jira-tk-btn" onclick="syncJiraTickets()">↻ Refresh</button>':'')+'<button class="ib" onclick="closeModal()"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg></button></div></div><div style="overflow-y:auto">'+body+'</div></div></div>';

async function syncJiraPRs(){
  if(!jiraReady()){openSettings('jira');return;}
  const headers=jiraHeaders();
  const epicKeys=projects.filter(p=>p.jiraKey&&!p.archived).map(p=>p.jiraKey).slice(0,30);
  const devPRStats={};
  try{
    for(const key of epicKeys){try{const r=await jFetch(JIRA+'/rest/dev-status/1.0/issue/detail?issueId='+key+'&applicationType=GitHub&dataType=pullrequest',{headers:headers});if(!r.ok)continue;const data=await r.json();const prs=(data.detail||[]).flatMap(d=>d.pullRequests||[]);prs.forEach(pr=>{const authorLogin=((pr.author&&pr.author.url)||'').split('/').pop().toLowerCase();const dev=devs.find(d=>{const parts=d.name.toLowerCase().split(' ');return authorLogin===parts[0]||authorLogin===parts[parts.length-1]||authorLogin===parts[0][0]+parts[parts.length-1];});if(!dev)return;if(!devPRStats[dev.id])devPRStats[dev.id]={prs:0,merged:0,cycles:[],repos:new Set()};devPRStats[dev.id].prs++;if(pr.status==='MERGED'){devPRStats[dev.id].merged++;if(pr.created&&pr.lastUpdate){const d=Math.round((new Date(pr.lastUpdate)-new Date(pr.created))/864e5);if(d>=0&&d<180)devPRStats[dev.id].cycles.push(d);}}if(pr.repositoryName)devPRStats[dev.id].repos.add(pr.repositoryName);});}catch(e){}}
    const stats=[];
    Object.keys(devPRStats).forEach(devId=>{const s=devPRStats[devId];const avg=s.cycles.length?Math.round(s.cycles.reduce((a,b)=>a+b,0)/s.cycles.length):null;ghData[devId]=Object.assign({},ghData[devId],{prs:s.prs,merged:s.merged,repos:Array.from(s.repos).slice(0,5),avgCycleDays:avg});if(avg!=null){const dev=devs.find(d=>d.id===devId);if(dev)stats.push({dev:dev.name,avg:avg,min:Math.min.apply(null,s.cycles),max:Math.max.apply(null,s.cycles),count:s.cycles.length});}});
    if(stats.length){const teamAvg=Math.round(stats.reduce((s,d)=>s+d.avg,0)/stats.length);window.livePRData={stats:stats.sort((a,b)=>a.avg-b.avg),teamAvg:teamAvg,asOf:new Date().toISOString().slice(0,10)};localStorage.setItem('plt_pr_data',JSON.stringify(window.livePRData));}
    localStorage.setItem('plt_gh_data',JSON.stringify(ghData));
    render();showToast('PR cycle time synced for '+Object.keys(devPRStats).length+' devs','info');
  }catch(err){showToast('PR sync failed: '+err.message,'warn');}
}

function removeDev(devId,fromManage){
  var dev=devs.find(function(d){return d.id===devId;});if(!dev)return;
  var n=Object.keys(assignments).filter(function(pid){return (assignments[pid]||[]).some(function(a){return a.devId===devId;});}).length;
  if(!confirm('Remove '+dev.name+' from the team?\n\nThey\'ll be taken off '+n+' project'+(n===1?'':'s')+' and drop out of capacity and metrics. You can restore them from Manage.'))return;
  var held={};Object.keys(assignments).forEach(function(pid){var e=(assignments[pid]||[]).filter(function(a){return a.devId===devId;});if(e.length)held[pid]=e;});
  var bk=removedDevs().filter(function(x){return x.dev.id!==devId;});bk.push({dev:dev,held:held,at:Date.now()});
  try{localStorage.setItem('plt_removed_devs',JSON.stringify(bk));}catch(e){}
  devs=devs.filter(function(d){return d.id!==devId;});
  Object.keys(assignments).forEach(function(pid){assignments[pid]=(assignments[pid]||[]).filter(function(a){return a.devId!==devId;});});

function restoreDev(devId){
  var bk=removedDevs(),x=bk.find(function(r){return r.dev.id===devId;});if(!x)return;
  if(!devs.some(function(d){return d.id===devId;}))devs.push(x.dev);
  Object.keys(x.held||{}).forEach(function(pid){if(!projects.some(function(p){return p.id===pid;}))return;var cur=assignments[pid]||(assignments[pid]=[]);x.held[pid].forEach(function(a){if(!cur.some(function(c){return c.devId===devId&&c.src===a.src;}))cur.push(a);});});
  try{localStorage.setItem('plt_removed_devs',JSON.stringify(bk.filter(function(r){return r.dev.id!==devId;})));}catch(e){}
  save();afterTeamChange(true);
  showToast('Restored '+x.dev.name,'info');

function wsSnapshot(){
  const today=new Date().toISOString().slice(0,10);

  const totalAlloc=devs.reduce((s,d)=>s+alloc(d.id),0),totalCap=devs.reduce((s,d)=>s+(d.capacity||100),0);
  return{weekEnding:today,teamSize:devs.length,capacityUsed:Math.round(totalAlloc/totalCap*100),
    overloaded:devs.filter(d=>alloc(d.id)>(d.capacity||100)).map(d=>d.name+' ('+alloc(d.id)+'%)'),
    available:devs.filter(d=>alloc(d.id)<(d.capacity||100)*.8).map(d=>d.name+' ('+alloc(d.id)+'%)'),
    blocked:active.filter(p=>p.status==='blocked').map(p=>({name:p.name,priority:priLabel(p.priority),deadline:p.deadline||'none'})),
    atRisk:active.filter(p=>p.status==='at-risk').map(p=>({name:p.name,priority:priLabel(p.priority),deadline:p.deadline||'none'})),
    overdue:active.filter(p=>p.deadline&&p.deadline<today&&p.status!=='done').map(p=>({name:p.name,priority:priLabel(p.priority),deadline:p.deadline})),
    upcoming:active.filter(p=>{if(!p.deadline||p.deadline<today)return false;const diff=(new Date(p.deadline)-new Date(today))/864e5;return diff<=21;}).sort((a,b)=>a.deadline<b.deadline?-1:1).map(p=>({name:p.name,priority:priLabel(p.priority),deadline:p.deadline,status:p.status})),
    inProgress:active.filter(p=>p.priority<=2&&(assignments[p.id]||[]).length>0).map(p=>{const mems=(assignments[p.id]||[]).map(a=>{const d=devs.find(x=>x.id===a.devId);return d?d.name.split(' ')[0]:null;}).filter(Boolean);const ms=p.milestones||[];return{name:p.name,workstream:p.workstream,priority:priLabel(p.priority),status:p.status,rag:projRag(p),execSummary:p.execSummary||'',nextStep:p.nextStep||'',team:mems,milestones:ms.length?{done:ms.filter(m=>m.done).length,total:ms.length,next:(ms.filter(m=>!m.done).sort((a,b)=>(a.date||'zzz')<(b.date||'zzz')?-1:1)[0]||{}).title||''}:null};}),
    github:Object.keys(ghData).length?Object.keys(ghData).map(id=>{const d=devs.find(x=>x.id===id);return d?{name:d.name.split(' ')[0],merged:ghData[id].merged||0,open:ghData[id].openPRs||0}:null;}).filter(Boolean):null};
}
function renderMarkdownLite(md){
  const lines=md.split('\n');let html='',inList=false;
  function inline(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
  lines.forEach(raw=>{
    const line=raw.trim();
    if(!line){if(inList){html+='</ul>';inList=false;}return;}
    if(/^#{1,3}\s/.test(line)){if(inList){html+='</ul>';inList=false;}html+='<h2>'+inline(line.replace(/^#{1,3}\s/,''))+'</h2>';return;}
    if(/^[-*•]\s/.test(line)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(line.replace(/^[-*•]\s/,''))+'</li>';return;}
    if(inList){html+='</ul>';inList=false;}
    html+='<p>'+inline(line)+'</p>';
  });
  if(inList)html+='</ul>';
  return html;
}
async function generateWeeklyStatus(){
  if(!anthropicKey){document.getElementById('ws-content').innerHTML='<div class="ws-empty"><div style="font-size:13px;font-weight:500">Add an Anthropic API key to generate</div><button class="btn btn-p" onclick="closeModal();openSettings()">Add API Key</button></div>';return;}

  document.getElementById('ws-content').innerHTML='<div class="ws-empty"><svg width="22" height="22" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" style="animation:spin 1s linear infinite"><path d="M1 6a5 5 0 1 1 1 3"/><polyline points="1,6 1,10 5,10"/></svg><div style="font-size:12px">Writing your '+wsAudience.toLowerCase()+' summary…</div></div>';
  const tone=wsAudience==='Executives'?'Concise and outcome-focused. Lead with what matters to leadership: delivery risk, capacity, and decisions needed. Minimal jargon.':wsAudience==='Team'?'Direct and practical for the engineering team. Recognize contributions, be clear about priorities and blockers.':'Clear and professional for external stakeholders. Focus on progress and timelines, avoid internal-only detail.';
  const prompt='Write a weekly status update for a PLT engineering team, ending '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'. Audience: '+wsAudience+'. Tone: '+tone+'\n\nUse ONLY this data — do not invent projects, names, or metrics:\n'+JSON.stringify(wsSnapshot())+'\n\nFormat as markdown with these sections using ## headers: "Summary" (2-3 sentence overview with capacity %), "In progress" (key P1/P2 work with owners — when a project has an execSummary use it as the basis for that line, and note milestone progress like 3/5 and RAG where relevant), "Risks & blockers" (blocked/overdue/at-risk items, be specific about priority and impact), "Capacity" (who is over/under, 1-2 sentences), "Coming up" (upcoming deadlines in next 3 weeks). Use bullet points. Bold key names, projects, and figures with **. Keep it tight and scannable — no filler. If a section has no data, write a brief positive note instead of omitting it.';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1600,messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();
    if(data.error)throw new Error(data.error.message||'request failed');
    wsMarkdown=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();

  }catch(err){document.getElementById('ws-content').innerHTML='<div class="ws-empty" style="color:var(--red)"><div style="font-size:12px">Couldn\'t generate: '+err.message.replace(/</g,'&lt;')+'</div></div>';if(btn){btn.textContent='✦ Generate';btn.disabled=false;}}
}

function linkifyChat(text){
  var out=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  // linkify full dev names
  [...devs].sort((a,b)=>b.name.length-a.name.length).forEach(d=>{
    const esc=d.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp('(?<![\\w>])'+esc+'(?![\\w<])','g'),'<span class="chat-entity" onclick="chatGoDev(\''+d.id+'\')">'+d.name+'</span>');
  });
  return out.replace(/\n/g,'<br>');
}

async function sendChatMessage(){
  const input=document.getElementById('chat-input');
  const msg=input.value.trim();if(!msg)return;
  if(!anthropicKey){
    const body=document.getElementById('chat-body');
    body.innerHTML+='<div class="chat-msg user">'+msg.replace(/</g,'&lt;')+'</div><div class="chat-msg bot">I need an Anthropic API key to answer. Add one in ⚙️ Settings → Anthropic, then ask again.</div>';
    input.value='';autoGrowChat(input);body.scrollTop=body.scrollHeight;return;
  }
  input.value='';autoGrowChat(input);
  const body=document.getElementById('chat-body');
  // clear starters on first message
  if(!chatHistory.length)body.innerHTML='';
  body.innerHTML+='<div class="chat-msg user">'+msg.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div>';
  chatHistory.push({role:'user',content:msg});
  const typing=document.createElement('div');typing.className='chat-typing';typing.id='chat-typing';typing.innerHTML='<span></span><span></span><span></span>';
  body.appendChild(typing);body.scrollTop=body.scrollHeight;
  document.getElementById('chat-send').disabled=true;
  const sys='You are the Planner Assistant for a PLT engineering team resource planner. Answer questions about team capacity, projects, assignments, deadlines, and risks using ONLY the JSON data below. Be concise and specific — use real names and numbers. Use **bold** for key names/figures. If asked for recommendations (e.g. who should take a project), reason from allocation and availability. If the data does not contain the answer, say so briefly. Current planner data:\n'+JSON.stringify(chatSnapshot());
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1024,system:sys,messages:chatHistory.slice(-10)})});
    const data=await resp.json();
    const el=document.getElementById('chat-typing');if(el)el.remove();
    if(data.error){body.innerHTML+='<div class="chat-msg bot">Error: '+(data.error.message||'request failed').replace(/</g,'&lt;')+'</div>';document.getElementById('chat-send').disabled=false;body.scrollTop=body.scrollHeight;return;}
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    chatHistory.push({role:'assistant',content:txt});
    body.innerHTML+='<div class="chat-msg bot">'+linkifyChat(txt)+'</div>';
  }catch(err){
    const el=document.getElementById('chat-typing');if(el)el.remove();
    body.innerHTML+='<div class="chat-msg bot">Couldn\'t reach the API: '+err.message.replace(/</g,'&lt;')+'</div>';
  }
  document.getElementById('chat-send').disabled=false;
  body.scrollTop=body.scrollHeight;
}
