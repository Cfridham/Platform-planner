<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Platform Projects Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--bg2:#FAFAFA;--sur:#FFFFFF;--s2:#F4F4F5;--s3:#E4E4E7;--bdr:#EAEAEC;--bdr2:#D4D4D8;--t:#18181B;--t2:#52525B;--t3:#A1A1AA;--acc:#4F46E5;--acc-l:#EEF2FF;--red:#DC2626;--red-l:#FEF2F2;--amb:#D97706;--amb-l:#FFFBEB;--grn:#16A34A;--grn-l:#F0FDF4;--blu:#2563EB;--blu-l:#EFF6FF;--mono:'JetBrains Mono',monospace;--r:6px;--r2:10px;--sh:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05);--sh2:0 8px 24px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t);height:100vh;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;}
@keyframes spin{to{transform:rotate(360deg)}}
.app{display:grid;grid-template-columns:1fr;grid-template-rows:44px 36px 1fr;height:100vh;overflow:hidden;position:relative;}
.topbar{grid-column:1/-1;background:var(--sur);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;}
.app-title{font-size:13px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
.top-btns{display:flex;gap:5px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--sur);color:var(--t);font-size:11px;font-family:inherit;cursor:pointer;font-weight:500;line-height:1.4;white-space:nowrap;}
.btn:hover{background:var(--s2);}
.btn-p{background:var(--t);color:#fff;border-color:var(--t);}
.btn-p:hover{background:#2a2a2a;}
.menu-item{padding:7px 14px;font-size:12px;cursor:pointer;color:var(--t);white-space:nowrap;display:block;width:100%;}
.menu-item:hover{background:var(--s2);}
.menu-sep{height:1px;background:var(--bdr);margin:3px 0;}
.toolbar{grid-column:1;background:var(--sur);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:5px;padding:0 12px;overflow-x:auto;}
.toolbar::-webkit-scrollbar{height:0;}
.dev-toolbar{grid-column:1;background:var(--sur);border-bottom:1px solid var(--bdr);border-right:1px solid var(--bdr);display:flex;align-items:center;padding:0 8px;gap:5px;}
.dev-lbl{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);}
.srch{flex:1;min-width:0;padding:4px 7px;border:1px solid var(--bdr);border-radius:var(--r);font-size:11px;font-family:inherit;background:var(--s2);color:var(--t);outline:none;}
.srch:focus{border-color:var(--acc);background:var(--sur);}
.fb{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--bdr);background:var(--sur);cursor:pointer;color:var(--t2);font-family:inherit;white-space:nowrap;}
.fb.on{background:var(--t);color:#fff;border-color:var(--t);}
.tb-sep{width:1px;height:14px;background:var(--bdr);flex-shrink:0;}
.view-seg{display:flex;border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;}
.vs-btn{padding:3px 9px;font-size:11px;font-family:inherit;background:var(--sur);border:none;cursor:pointer;color:var(--t2);border-right:1px solid var(--bdr);}
.vs-btn:last-child{border-right:none;}
.vs-btn.on{background:var(--t);color:#fff;}
.dev-panel{grid-row:3;background:var(--sur);border-right:1px solid var(--bdr);overflow-y:auto;display:flex;flex-direction:column;}
.dev-group-lbl{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 3px;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
.dev-group-cnt{font-size:10px;padding:1px 5px;border-radius:99px;background:var(--s2);color:var(--t2);}
.dc{display:flex;align-items:center;gap:7px;padding:7px 8px;border-bottom:1px solid var(--bdr);position:relative;}
.dc:hover .d-acts{opacity:1;}
.dav{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;cursor:pointer;}
.dav img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
.d-info{flex:1;min-width:0;}
.d-name{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-meta{display:flex;align-items:center;gap:4px;margin-top:1px;flex-wrap:wrap;}
.d-pct{font-size:10px;font-family:var(--mono);font-weight:600;}
.d-pct.over{color:var(--red);}
.d-pct.warn{color:var(--amb);}
.off-tag{font-size:8px;padding:1px 4px;border-radius:3px;background:var(--blu-l);color:var(--blu);font-weight:600;}
.d-acts{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px;opacity:0;transition:opacity .1s;background:var(--sur);border-radius:var(--r);padding:2px;}
.ib{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;border:none;background:transparent;cursor:pointer;color:var(--t2);}
.ib:hover{background:var(--s2);}
.ib svg{width:11px;height:11px;}
.gh-bar{display:flex;align-items:center;gap:3px;margin-top:2px;}
.gh-dot{width:5px;height:5px;border-radius:50%;}
.gh-badge{font-size:9px;padding:1px 4px;border-radius:3px;background:#F5F0FF;color:#6D28D9;font-weight:600;white-space:nowrap;}
.board-wrap{grid-column:1;grid-row:3;overflow:auto;background:var(--bg);}
.sum-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 12px 0;}
.sum-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);padding:11px 13px;}
.sum-val{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;line-height:1;}
.sum-lbl{font-size:10px;color:var(--t2);margin-top:2px;font-weight:500;}
.sum-card.red{border-left:3px solid var(--red);}
.sum-card.amb{border-left:3px solid var(--amb);}
.sum-card.grn{border-left:3px solid var(--grn);}
.sum-bar-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.sum-chip{font-size:9px;padding:1px 5px;border-radius:99px;background:var(--s2);color:var(--t2);cursor:pointer;white-space:nowrap;}
.sum-chip:hover{background:var(--s3);}
.sum-chip.red{background:var(--red-l);color:var(--red);}
.sum-chip.amb{background:var(--amb-l);color:var(--amb);}
.ws-row{padding:8px 12px 4px;display:flex;align-items:center;gap:8px;}
.ws-label{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;}
.ws-dot{width:6px;height:6px;border-radius:50%;}
.ws-count{font-size:9px;color:var(--t3);}
.ws-chevron{font-size:10px;color:var(--t3);transition:transform .2s;}
.ws-chevron.collapsed{transform:rotate(-60deg);}
.cards-row{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 10px;}
.kb-cols{display:flex;gap:12px;padding:12px;overflow-x:auto;align-items:flex-start;height:100%;box-sizing:border-box;}
.kb-col{flex:0 0 258px;width:258px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);display:flex;flex-direction:column;max-height:100%;}
.kb-col-head{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--bg2);border-radius:var(--r2) var(--r2) 0 0;z-index:1;}
.kb-col-dot{width:8px;height:8px;border-radius:99px;flex-shrink:0;}
.kb-col-title{font-size:12px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kb-col-count{font-size:10px;font-family:var(--mono);color:var(--t3);background:var(--sur);border:1px solid var(--bdr);border-radius:99px;padding:1px 7px;}
.kb-col-body{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.kb-col-body .pc{width:auto;min-width:0;}
.kb-col-empty{font-size:10px;color:var(--t3);text-align:center;padding:14px 8px;}
.kb-wip-warn{color:var(--red)!important;border-color:var(--red)!important;}
.port-wrap{padding:14px 16px;overflow-y:auto;height:100%;box-sizing:border-box;}
.port-group{margin-bottom:20px;}
.port-group-hd{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.port-group-dot{width:9px;height:9px;border-radius:99px;flex-shrink:0;}
.port-group-title{font-size:12px;font-weight:700;letter-spacing:.03em;}
.port-group-count{font-size:10px;font-family:var(--mono);color:var(--t3);background:var(--sur);border:1px solid var(--bdr);border-radius:99px;padding:1px 8px;}
.port-group-rule{flex:1;height:1px;background:var(--bdr);}
.port-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.port-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s;}
.port-card:hover{box-shadow:var(--sh);transform:translateY(-1px);}
.port-card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-l);}
.port-park{flex-shrink:0;font-size:11px;color:var(--t3);cursor:pointer;opacity:0;transition:opacity .12s;padding:0 2px;line-height:1;}
.port-card:hover .port-park{opacity:.6;}
.port-park:hover{opacity:1!important;color:var(--red);}
.port-card-parked{opacity:.66;}
.plan-chip{font-size:8px;font-weight:600;padding:1px 5px;border-radius:99px;background:rgba(124,58,237,.14);color:#7C3AED;margin-left:5px;}
.plan-av{outline:1.5px dashed #7C3AED;outline-offset:1px;}
#plan-banner{background:rgba(124,58,237,.10);border-bottom:1px solid rgba(124,58,237,.25);color:#7C3AED;font-size:11px;padding:6px 16px;display:flex;align-items:center;gap:10px;}
#planmode-btn.on{background:#7C3AED;color:#fff;border-color:#7C3AED;}
.port-card-parked:hover{opacity:1;}
.eng-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s;}
.eng-card:hover{border-color:var(--acc);box-shadow:var(--sh);transform:translateY(-1px);}
.eng-card-muted{opacity:.62;}
.eng-card-muted:hover{opacity:1;}
.jsp-spin{display:inline-block;animation:jspspin 1s linear infinite;color:var(--acc);}
@keyframes jspspin{to{transform:rotate(360deg)}}
.pc{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r2);width:220px;min-width:220px;cursor:pointer;transition:border-color .1s,box-shadow .1s;position:relative;overflow:hidden;}
.pc:hover{border-color:var(--bdr2);box-shadow:var(--sh);}
.pc.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-l);}
.pc-stripe{height:3px;}
.pc-body{padding:8px 9px 6px;}
.pc-name{font-size:11px;font-weight:500;line-height:1.3;margin-bottom:4px;}
.pc-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.tag{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;}
.pri1{background:var(--red-l);color:var(--red);}
.pri2{background:var(--amb-l);color:var(--amb);}
.pri3{background:var(--acc-l);color:var(--acc);}
.pri4{background:var(--s2);color:var(--t3);}
.pc-date{font-size:9px;padding:1px 4px;border-radius:3px;font-family:var(--mono);}
.pc-date.overdue{background:var(--red-l);color:var(--red);}
.pc-date.soon{background:var(--amb-l);color:var(--amb);}
.pc-date.ok{background:var(--grn-l);color:var(--grn);}
.sz-tag{font-size:9px;padding:1px 4px;border-radius:3px;background:var(--s2);color:var(--t3);}
.flags-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;}
.flag{display:inline-flex;align-items:center;gap:2px;font-size:9px;font-weight:600;padding:1px 5px;border-radius:99px;cursor:pointer;user-select:none;border:1px solid transparent;}
.flag-red{background:#FEE2E2;color:#991B1B;border-color:#FECACA;}
.flag-amber{background:#FEF3C7;color:#92400E;border-color:#FDE68A;}
.flag-blue{background:#DBEAFE;color:#1E40AF;border-color:#BFDBFE;}
.flag-green{background:#D1FAE5;color:#065F46;border-color:#A7F3D0;}
.flag-purple{background:#EDE9FE;color:#5B21B6;border-color:#DDD6FE;}
.flag-gray{background:#F3F4F6;color:#374151;border-color:#E5E7EB;}
.pc-devs{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;padding-top:5px;border-top:1px solid var(--bdr);}
.pc-dev-chip{display:flex;align-items:center;gap:3px;font-size:9px;padding:2px 6px;border-radius:99px;background:var(--s2);cursor:pointer;color:var(--t2);}
.pc-dev-chip:hover{background:var(--s3);}
.pc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px;padding-top:6px;border-top:1px solid var(--bdr);}
.pc-avs{display:inline-flex;align-items:center;}
.pc-av{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;overflow:hidden;border:1.5px solid var(--sur);box-sizing:content-box;}
.pc-av img{width:100%;height:100%;object-fit:cover;}
.pc-av-more{background:var(--s3);color:var(--t2);font-size:9px;}
.pc-foot-pct{font-size:10px;font-family:var(--mono);font-weight:600;color:var(--t3);}
.pc-flag-dot{width:7px;height:7px;border-radius:50%;display:inline-block;border:1px solid transparent;}
.pc-flag-dot.flag-red{background:#EF4444;}
.pc-flag-dot.flag-amber{background:#F59E0B;}
.pc-flag-dot.flag-blue{background:#3B82F6;}
.pc-flag-dot.flag-green{background:#10B981;}
.pc-flag-dot.flag-purple{background:#8B5CF6;}
.pc-flag-dot.flag-gray{background:#9CA3AF;}
.pc-meta{margin-top:5px;}
.pc-dev-av{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0;overflow:hidden;}
.pc-dev-av img{width:100%;height:100%;object-fit:cover;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.dot-on{background:var(--grn);}
.dot-risk{background:var(--amb);}
.dot-block{background:var(--red);}
.dot-done{background:var(--t3);}
.dot-plan{background:var(--acc);}
.detail-panel{grid-row:3;background:var(--sur);border-left:1px solid var(--bdr);overflow-y:auto;}
.dp-head{padding:12px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;gap:8px;position:sticky;top:0;background:var(--sur);z-index:1;}
.dp-title{font-size:13px;font-weight:600;flex:1;line-height:1.3;}
.sec{margin:10px 14px;}
.sec-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.notes{width:100%;padding:7px 8px;border:1px solid var(--bdr);border-radius:var(--r);font-size:11px;font-family:inherit;resize:vertical;min-height:60px;outline:none;color:var(--t);background:var(--s2);}
.notes:focus{border-color:var(--acc);background:var(--sur);}
.field{margin-bottom:10px;}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:6px 9px;border:1px solid var(--bdr);border-radius:var(--r);font-size:12px;font-family:inherit;outline:none;background:var(--sur);color:var(--t);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);}
.alloc-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bdr);}
.alloc-row:last-child{border-bottom:none;}
.alloc-bar{flex:1;height:4px;background:var(--s2);border-radius:99px;overflow:hidden;}
.alloc-fill{height:100%;border-radius:99px;}
.qa-grid{display:flex;flex-wrap:wrap;gap:5px;}
.qa-chip{display:flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--bdr);border-radius:var(--r);background:var(--sur);cursor:pointer;font-size:11px;font-family:inherit;}
.qa-chip:hover{background:var(--s2);}
.qa-av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0;overflow:hidden;}
.qa-av img{width:100%;height:100%;object-fit:cover;}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal{background:var(--sur);border-radius:var(--r2);box-shadow:var(--sh2);width:90%;max-width:500px;max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;}
.mh{padding:14px 16px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.mt{font-size:14px;font-weight:600;flex:1;}
.mb{padding:14px 16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.mf{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:var(--r2);font-size:12px;font-weight:500;box-shadow:var(--sh2);z-index:9999;pointer-events:none;animation:toast-in .2s ease;}
.toast.warn{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;}
.toast.info{background:#EFF6FF;color:#1E40AF;border:1px solid #BFDBFE;}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.heatmap-wrap{padding:16px;overflow:auto;}
.hm-table{border-collapse:separate;border-spacing:3px;font-size:11px;}
.hm-th{font-size:9px;font-weight:600;padding:4px 6px;color:var(--t3);text-align:left;white-space:nowrap;}
.hm-dev{font-size:11px;font-weight:500;padding:4px 8px;white-space:nowrap;}
.hm-cell{width:56px;height:28px;border-radius:var(--r);font-size:10px;font-family:var(--mono);font-weight:600;text-align:center;cursor:pointer;}
.insights-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:200;display:flex;align-items:flex-start;justify-content:flex-end;backdrop-filter:blur(2px);}
.insights-drawer{width:400px;height:100vh;background:var(--sur);display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.1);}
.insights-head{padding:14px 16px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.insights-body{flex:1;overflow-y:auto;padding:12px 14px 20px;}
.insight-card{border:1px solid var(--bdr);border-radius:var(--r2);padding:11px 13px;margin-bottom:9px;}
.insight-card.risk{border-left:3px solid var(--red);}
.insight-card.warn{border-left:3px solid var(--amb);}
.insight-card.good{border-left:3px solid var(--grn);}
.insight-card.info{border-left:3px solid var(--acc);}
.insight-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.insight-label.risk{color:var(--red);}
.insight-label.warn{color:var(--amb);}
.insight-label.good{color:var(--grn);}
.insight-label.info{color:var(--acc);}
.insight-title{font-size:12px;font-weight:600;margin-bottom:4px;line-height:1.3;}
.insight-body{font-size:11px;color:var(--t2);line-height:1.5;}
.insight-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.insight-chip{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--s2);color:var(--t2);cursor:pointer;}
.insight-chip.red{background:var(--red-l);color:var(--red);}
.insight-chip.amb{background:var(--amb-l);color:var(--amb);}
.insight-chip.grn{background:var(--grn-l);color:var(--grn);}
.insight-chip.blu{background:var(--acc-l);color:var(--acc);}
.insight-section{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin:14px 0 7px;}
.tv-row{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bdr);}
.tv-row:hover{background:var(--s2);}
.tv-row.tv-row-sel{background:var(--acc-l);border-left:3px solid var(--acc);}
.exec-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}

function isoWeek(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const wk1=new Date(d.getFullYear(),0,4);return d.getFullYear()+'-W'+String(1+Math.round(((d-wk1)/864e5-3+(wk1.getDay()+6)%7)/7)).padStart(2,'0');}
function trendSnapshot(cur){
  // cur = {capPct, blocked, atRisk, overloaded}; returns previous week's snapshot for comparison
  let arr=[];try{arr=JSON.parse(localStorage.getItem('plt_trend')||'[]');}catch(e){}
  const wk=isoWeek(new Date());
  const prior=arr.filter(s=>s.week!==wk).sort((a,b)=>a.week<b.week?1:-1)[0]||null;
  // upsert current week
  arr=arr.filter(s=>s.week!==wk);arr.push(Object.assign({week:wk},cur));
  arr=arr.sort((a,b)=>a.week<b.week?1:-1).slice(0,8);
  try{localStorage.setItem('plt_trend',JSON.stringify(arr));}catch(e){}
  return prior;
}
function throughputSnapshot(){
  // record this week's total merged; return chronological array of {week, merged}
  const total=Object.keys(ghData).reduce((s,id)=>s+(ghData[id].merged||0),0);
  let arr=[];try{arr=JSON.parse(localStorage.getItem('plt_throughput')||'[]');}catch(e){}
  const wk=isoWeek(new Date());
  arr=arr.filter(s=>s.week!==wk);
  if(Object.keys(ghData).length)arr.push({week:wk,merged:total});
  arr=arr.sort((a,b)=>a.week<b.week?-1:1).slice(-8);
  try{localStorage.setItem('plt_throughput',JSON.stringify(arr));}catch(e){}
  return arr;
}

function renderInsights(insights){

async function generateInsights(){
  if(!anthropicKey){showInsightsPrompt();return;}
  const el=document.getElementById('insights-body');if(el)el.innerHTML='<div style="padding:20px;text-align:center;font-size:12px;color:var(--t2)">Analysing…</div>';
  const today=new Date().toISOString().slice(0,10);
  const snap={today:today,devs:devs.map(d=>{const pct=alloc(d.id),cap=d.capacity||100;const dps=projects.filter(p=>!p.archived&&p.status!=='done'&&(assignments[p.id]||[]).find(a=>a.devId===d.id));return{name:d.name,totalAlloc:pct,capacity:cap,overloaded:pct>=cap,free:pct<20,projectCount:dps.length,projects:dps.map(p=>{const a=(assignments[p.id]||[]).find(x=>x.devId===d.id);return{name:p.name.slice(0,35),deadline:p.deadline||'TBD',status:p.status,allocation:a?a.pct:0,workstream:p.workstream};})};})};
  const prompt='You are a tech lead analysing a PLT engineering team resource planner. Today is '+today+'. Provide 8-10 specific insights covering health, capacity risks, resourcing gaps, and availability forecast. Data: '+JSON.stringify(snap)+'. Return ONLY a JSON array. Each: {"type":"risk"|"warn"|"good"|"info","label":"string","title":"string","body":"string","chips":["name"]}. Be specific with names.';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const ins=JSON.parse(txt.replace(/```json|```/g,'').trim());
    if(Array.isArray(ins)&&ins.length){window.LIVE_INSIGHTS=ins;renderInsights(ins);}
  }catch(err){if(el)el.innerHTML='<div style="padding:14px;font-size:12px;color:var(--red)">Error: '+err.message+'</div>';}
}

  const epicKeys=projects.filter(p=>p.jiraKey&&!p.archived).map(p=>p.jiraKey).slice(0,30);
  const devPRStats={};
  try{
    for(const key of epicKeys){try{const r=await jFetch(JIRA+'/rest/dev-status/1.0/issue/detail?issueId='+key+'&applicationType=GitHub&dataType=pullrequest',{headers:headers});if(!r.ok)continue;const data=await r.json();const prs=(data.detail||[]).flatMap(d=>d.pullRequests||[]);prs.forEach(pr=>{const authorLogin=((pr.author&&pr.author.url)||'').split('/').pop().toLowerCase();const dev=devs.find(d=>{const parts=d.name.toLowerCase().split(' ');return authorLogin===parts[0]||authorLogin===parts[parts.length-1]||authorLogin===parts[0][0]+parts[parts.length-1];});if(!dev)return;if(!devPRStats[dev.id])devPRStats[dev.id]={prs:0,merged:0,cycles:[],repos:new Set()};devPRStats[dev.id].prs++;if(pr.status==='MERGED'){devPRStats[dev.id].merged++;if(pr.created&&pr.lastUpdate){const d=Math.round((new Date(pr.lastUpdate)-new Date(pr.created))/864e5);if(d>=0&&d<180)devPRStats[dev.id].cycles.push(d);}}if(pr.repositoryName)devPRStats[dev.id].repos.add(pr.repositoryName);});}catch(e){}}
    const stats=[];
    Object.keys(devPRStats).forEach(devId=>{const s=devPRStats[devId];const avg=s.cycles.length?Math.round(s.cycles.reduce((a,b)=>a+b,0)/s.cycles.length):null;ghData[devId]=Object.assign({},ghData[devId],{prs:s.prs,merged:s.merged,repos:Array.from(s.repos).slice(0,5),avgCycleDays:avg});if(avg!=null){const dev=devs.find(d=>d.id===devId);if(dev)stats.push({dev:dev.name,avg:avg,min:Math.min.apply(null,s.cycles),max:Math.max.apply(null,s.cycles),count:s.cycles.length});}});
    if(stats.length){const teamAvg=Math.round(stats.reduce((s,d)=>s+d.avg,0)/stats.length);window.livePRData={stats:stats.sort((a,b)=>a.avg-b.avg),teamAvg:teamAvg,asOf:new Date().toISOString().slice(0,10)};localStorage.setItem('plt_pr_data',JSON.stringify(window.livePRData));}
    localStorage.setItem('plt_gh_data',JSON.stringify(ghData));
    render();showToast('PR cycle time synced for '+Object.keys(devPRStats).length+' devs','info');
  }catch(err){showToast('PR sync failed: '+err.message,'warn');}
}

function renderMarkdownLite(md){
  const lines=md.split('\n');let html='',inList=false;
  function inline(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
  lines.forEach(raw=>{
    const line=raw.trim();
    if(!line){if(inList){html+='</ul>';inList=false;}return;}
    if(/^#{1,3}\s/.test(line)){if(inList){html+='</ul>';inList=false;}html+='<h2>'+inline(line.replace(/^#{1,3}\s/,''))+'</h2>';return;}
    if(/^[-*•]\s/.test(line)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(line.replace(/^[-*•]\s/,''))+'</li>';return;}
    if(inList){html+='</ul>';inList=false;}
    html+='<p>'+inline(line)+'</p>';
  });
  if(inList)html+='</ul>';
  return html;
}

    const el=document.getElementById('chat-typing');if(el)el.remove();
    if(data.error){body.innerHTML+='<div class="chat-msg bot">Error: '+(data.error.message||'request failed').replace(/</g,'&lt;')+'</div>';document.getElementById('chat-send').disabled=false;body.scrollTop=body.scrollHeight;return;}
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    chatHistory.push({role:'assistant',content:txt});
    body.innerHTML+='<div class="chat-msg bot">'+linkifyChat(txt)+'</div>';
  }catch(err){
    const el=document.getElementById('chat-typing');if(el)el.remove();
    body.innerHTML+='<div class="chat-msg bot">Couldn\'t reach the API: '+err.message.replace(/</g,'&lt;')+'</div>';
  }
  document.getElementById('chat-send').disabled=false;
  body.scrollTop=body.scrollHeight;
}
function render(){if(view==='overview')renderOverview();else if(view==='board'){renderBoard();renderSummary();}else if(view==='team')renderTeamView();else if(view==='flow')renderFlowView();}
view='overview';
applyExecMode();
setView('overview');
function updateSyncStatus(){const el=document.getElementById('sync-status');if(!el)return;const t=+(localStorage.getItem('plt_last_sync')||0);if(!t){el.textContent=jiraReady()?'Not synced yet':'';return;}const mins=Math.floor((Date.now()-t)/60000);el.textContent=mins<1?'Synced just now':mins<60?'Synced '+mins+'m ago':'Synced '+Math.floor(mins/60)+'h ago';}
updateSyncStatus();setInterval(updateSyncStatus,60000);
setTimeout(()=>{try{autoSyncJira();}catch(e){}},400);

</script>
